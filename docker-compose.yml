# Local development database. Production runs managed Postgres on Railway.
services:
  postgres:
    image: postgres:17-alpine
    container_name: lugar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lugar
      POSTGRES_PASSWORD: lugar
      POSTGRES_DB: lugar
      # Deterministic collation so ORDER BY on Cyrillic/Spanish text matches prod.
      LANG: C.UTF-8
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lugar -d lugar"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
