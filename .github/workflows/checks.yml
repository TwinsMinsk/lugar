# Checks that run on every push and pull request.
#
# Deliberately does not deploy. Railway is connected to this repository and
# deploys `main` itself, so a workflow that also ran `railway up` would produce
# two deployments per push — and with a volume attached they cannot run at the
# same time, because Railway stops the old container before starting the new
# one rather than letting two processes write to one disk.
#
# **Wait for CI** is on in Railway → service → Settings, and verified: the build
# there starts three to four seconds after this workflow goes green. Both jobs
# below gate the release, because Railway waits for every action to succeed.
name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run format:check

      # Unit tests only. The integration suites run in the `build` job below,
      # where a Postgres already exists. The end-to-end suite needs a built site
      # and a browser, and stays out of the workflow that gates a release.
      - run: npx vitest run tests/unit

  # Everything that needs a database: the integration suites, and the build.
  #
  # It sounds redundant next to Railway, which builds anyway. It is not, because
  # of how a failed deploy behaves: nothing is paged, nothing goes down, and the
  # site quietly keeps serving the previous release. A push that cannot build
  # therefore looks exactly like a push that shipped — that is how a broken
  # release once sat unnoticed for thirteen minutes while someone waited for a
  # change that was never going to appear. A red check on the commit says it in
  # seconds instead.
  #
  # `next build` prerenders, and prerendering runs the real queries, so this
  # needs a real database with real content — hence the service container, the
  # migration and the seed. Postgres 18 mirrors the deployed version, so the DDL
  # in a migration is exercised against the engine that will actually run it.
  #
  # Mirroring the version is not ceremony. The first run of this job against 18
  # failed a schema invariant: an `ON DELETE RESTRICT` refusal reports SQLSTATE
  # 23001 there and 23503 on 17, so a test asserting the latter was right on
  # every developer machine and wrong about production. It had never run against
  # the deployed version before this job existed.
  #
  # The integration suites live here rather than in `verify` because this is
  # where the database already is. Thirty-eight tests covering publishing
  # invariants, outbox behaviour and schema constraints were being skipped in CI
  # for want of a Postgres, and they run in about eight seconds.
  #
  # What this does NOT catch, stated plainly so nobody trusts it further than it
  # goes: a schema that is behind the code. The database here is always migrated
  # to match the commit, so a mismatch cannot occur — that failure mode is
  # handled by `scripts/migrate-for-build.ts`, not by this job.
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: lugar
          POSTGRES_PASSWORD: lugar
          POSTGRES_DB: lugar
        options: >-
          --health-cmd "pg_isready -U lugar -d lugar"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://lugar:lugar@localhost:5432/lugar
      # The integration suites create and drop their own database.
      DATABASE_URL_TEST: postgresql://lugar:lugar@localhost:5432/lugar_test
      DATABASE_ADMIN_URL: postgresql://lugar:lugar@localhost:5432/postgres
      # Placeholders, not secrets. The build phase does not require either — the
      # environment contract exempts it — but better-auth logs an error per
      # prerendered admin route without them, which buries anything real.
      BETTER_AUTH_SECRET: ci-placeholder-not-a-real-secret-000000
      PREVIEW_SECRET: ci-placeholder-not-a-real-secret-000000
      # So canonical URLs and the sitemap are built in their production shape.
      NEXT_PUBLIC_APP_URL: https://lugar.up.railway.app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # First, because they take eight seconds and the build takes minutes.
      - run: npx vitest run tests/integration

      - run: npm run db:migrate

      # Without content there is almost nothing to prerender, and the job would
      # pass while proving very little. Seeded, it renders the real ten pages.
      - run: npm run db:seed

      - run: npm run build

  # The end-to-end suite, which until now ran only on a developer's machine.
  #
  # A separate job rather than steps appended to `build`, because it needs a
  # browser and its own server, and because a failure here should be legible as
  # "the site does not work" rather than as "the build failed". It builds again
  # through Playwright's own `webServer` — the config deliberately never reuses
  # a server it did not start, and that rule is what stops a suite from quietly
  # testing an hour-old build.
  #
  # The admin project needs an owner account, so the job creates one and signs
  # in as it. The password below is not a secret in any meaningful sense: it
  # belongs to an account in a database that exists for the length of this job
  # and is discarded with the container.
  #
  # `mobile` is left out. It re-runs the public specs at a phone viewport,
  # which doubles the slowest part of the job to catch a class of defect —
  # layout at a narrow width — that these specs barely assert on. It stays a
  # local command until there are specs that would actually fail there.
  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: lugar
          POSTGRES_PASSWORD: lugar
          POSTGRES_DB: lugar
        options: >-
          --health-cmd "pg_isready -U lugar -d lugar"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://lugar:lugar@localhost:5432/lugar
      BETTER_AUTH_SECRET: ci-placeholder-not-a-real-secret-000000
      PREVIEW_SECRET: ci-placeholder-not-a-real-secret-000000
      # The suite drives the site over plain http on localhost, so the app must
      # be told that is its own origin — otherwise better-auth refuses the
      # sign-in as a cross-origin credential submission and every admin spec
      # fails looking like a wrong password.
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
      BETTER_AUTH_TRUSTED_ORIGINS: http://127.0.0.1:3100,http://localhost:3100
      # Photographs live on disk here; the suite uploads real files.
      STORAGE_DRIVER: local
      STORAGE_LOCAL_ROOT: /tmp/lugar-media
      # Without these the entire webhook suite skips itself, and with it the
      # only coverage of the route Meta talks to. The values are arbitrary:
      # the test signs its payloads with the same secret the server verifies
      # them against, so any string exercises the real HMAC path.
      WHATSAPP_APP_SECRET: ci-webhook-secret-not-a-real-one
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: ci-verify-token-not-a-real-one
      INITIAL_OWNER_EMAIL: owner@lugar.test
      INITIAL_OWNER_PASSWORD: ci-owner-password-not-a-secret
      E2E_ADMIN_EMAIL: owner@lugar.test
      E2E_ADMIN_PASSWORD: ci-owner-password-not-a-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm run db:migrate

      - run: npm run db:seed

      # Without this the setup project skips itself for want of credentials,
      # and every admin spec then fails on a storage-state file that was never
      # written.
      - name: Create the owner account the admin specs sign in as
        run: npm run auth:bootstrap

      - run: npx playwright test --project=desktop --project=admin

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
